# Coolify deployment of the YTŠkola Zitadel stack.
#
# Adapted from the production compose at /opt/zitadel on 46.225.98.108
# (docker-compose.yml + docker-compose.mode-letsencrypt.yml), with two
# deliberate differences:
#
#   1. No TLS and no ACME here. Coolify's Traefik terminates TLS and forwards
#      plain HTTP to this stack's own proxy on its `web` entrypoint, so only
#      the `-web` routers survive; every `-websecure` router and certresolver
#      label is gone. The routing *rules* are otherwise identical to prod,
#      including priorities and the h2c scheme to the API.
#
#   2. The login image is built from this repo rather than pulled. The
#      production image only ever existed on the prod host.
#
# The inner proxy is kept instead of translating these rules into Coolify's
# own Traefik labels: Coolify stores generated labels as a base64 snapshot and
# replays it on every deploy, and this routing depends on priority ordering
# plus an h2c upgrade. Nesting keeps the proven rules untouched.

services:
  proxy:
    # Built rather than pulled so coolify/traefik-dynamic.yml ships inside the
    # image; see Dockerfile.proxy.
    build:
      context: .
      dockerfile: coolify/Dockerfile.proxy
    restart: unless-stopped
    command:
      # File provider, not docker. The docker provider would expose these
      # routers to Coolify's unconstrained Traefik on the shared socket, and
      # would also lose ${VAR} interpolation in labels.
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=true
      - --entrypoints.web.address=:80
      - --api.dashboard=false
      - --api.insecure=false
      - --ping=true
      - --ping.entrypoint=web
      - --log.level=${TRAEFIK_LOG_LEVEL}
      - --accesslog=${TRAEFIK_ACCESSLOG_ENABLED}
    expose:
      - 80
    networks:
      - zitadel
      - coolify
    labels:
      # Coolify's Traefik has no providers.docker.network setting, so with this
      # container on more than one network it cannot decide which IP to dial.
      # Naming the shared network makes the outer hop deterministic.
      - traefik.docker.network=coolify
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping", "--ping.entrypoint=web"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 10s
    depends_on:
      zitadel-api:
        condition: service_healthy
      zitadel-login:
        condition: service_healthy

  zitadel-api:
    image: ghcr.io/zitadel/zitadel:${ZITADEL_VERSION}
    restart: unless-stopped
    user: "0"
    command: start-from-init --masterkey "${ZITADEL_MASTERKEY}"
    environment:
      ZITADEL_PORT: 8080
      ZITADEL_EXTERNALDOMAIN: ${ZITADEL_DOMAIN}
      ZITADEL_EXTERNALPORT: 443
      ZITADEL_EXTERNALSECURE: true
      ZITADEL_TLS_ENABLED: false

      ZITADEL_DATABASE_POSTGRES_DSN: ${ZITADEL_DATABASE_POSTGRES_DSN}

      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORDCHANGEREQUIRED: false
      ZITADEL_FIRSTINSTANCE_LOGINCLIENTPATPATH: /zitadel/bootstrap/login-client.pat
      ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_MACHINE_USERNAME: login-client
      ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_MACHINE_NAME: Automatically Initialized IAM_LOGIN_CLIENT
      ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_PAT_EXPIRATIONDATE: ${LOGIN_CLIENT_PAT_EXPIRATION}

      # No :443 in these URLs -- prod's letsencrypt overlay drops the port and
      # the values below match what the live containers actually run with.
      ZITADEL_DEFAULTINSTANCE_FEATURES_LOGINV2_REQUIRED: true
      ZITADEL_DEFAULTINSTANCE_FEATURES_LOGINV2_BASEURI: https://${ZITADEL_DOMAIN}/ui/v2/login/
      ZITADEL_OIDC_DEFAULTLOGINURLV2: https://${ZITADEL_DOMAIN}/ui/v2/login/login?authRequest=
      ZITADEL_OIDC_DEFAULTLOGOUTURLV2: https://${ZITADEL_DOMAIN}/ui/v2/login/logout?post_logout_redirect=
      ZITADEL_SAML_DEFAULTLOGINURLV2: https://${ZITADEL_DOMAIN}/ui/v2/login/login?samlRequest=

      ZITADEL_LOGSTORE_ACCESS_STDOUT_ENABLED: ${ZITADEL_ACCESS_LOG_STDOUT_ENABLED}
      ZITADEL_INSTRUMENTATION_TRACE_EXPORTER_TYPE: none
    healthcheck:
      test:
        - CMD
        - /app/zitadel
        - ready
      interval: 10s
      timeout: 30s
      retries: 12
      start_period: 20s
    volumes:
      - zitadel-bootstrap:/zitadel/bootstrap:rw
    networks:
      - zitadel
    depends_on:
      postgres:
        condition: service_healthy
    # No traefik labels: routing lives in coolify/traefik-dynamic.yml. Any label
    # here would also be read by Coolify's Traefik, which shares the socket.

  zitadel-login:
    # Coolify invokes compose with --project-directory set to the repo root, so
    # relative paths here resolve from there, not from this file's directory.
    # Dockerfile.build also requires the monorepo root as its context.
    build:
      context: .
      dockerfile: apps/login/Dockerfile.build
    restart: unless-stopped
    user: "0"
    environment:
      ZITADEL_API_URL: http://zitadel-api:8080
      NEXT_PUBLIC_BASE_PATH: /ui/v2/login
      ZITADEL_SERVICE_USER_TOKEN_FILE: /zitadel/bootstrap/login-client.pat
      CUSTOM_REQUEST_HEADERS: Host:${ZITADEL_DOMAIN},X-Forwarded-Proto:https
    healthcheck:
      test:
        - CMD
        - /bin/sh
        - -c
        - node /app/healthcheck.mjs http://localhost:3000/ui/v2/login/healthy
      interval: 10s
      timeout: 30s
      retries: 12
      start_period: 20s
    volumes:
      - zitadel-bootstrap:/zitadel/bootstrap:ro
    networks:
      - zitadel
    depends_on:
      zitadel-api:
        condition: service_healthy
    # No traefik labels -- see the note on zitadel-api.

  postgres:
    image: ${POSTGRES_IMAGE}
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD}
      POSTGRES_USER: ${POSTGRES_ADMIN_USER}
      POSTGRES_DB: ${POSTGRES_DB}
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -d ${POSTGRES_DB} -U ${POSTGRES_ADMIN_USER}
      interval: 10s
      timeout: 30s
      retries: 10
      start_period: 20s
    volumes:
      - postgres-data:/var/lib/postgresql/data:rw
    networks:
      - zitadel

networks:
  zitadel:
    name: zitadel-ytskola
  # Coolify's own network, where coolify-proxy lives. The inner proxy joins it
  # so the outer hop has a network in common to dial.
  coolify:
    external: true

volumes:
  postgres-data:
  zitadel-bootstrap:
